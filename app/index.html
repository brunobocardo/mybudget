<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MyBudget</title>
<link rel="icon" type="image/png" href="/favicon.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root {
  --bg:#f2f5f3; --panel:#ffffff; --panel2:#f7faf8; --ink:#13201c; --muted:#66776f; --line:#e1e8e4;
  --brand:#12806a; --brand2:#2ec484; --deep:#0b5452; --red:#d9483f; --amber:#e8a016; --blue:#3b82f6; --violet:#8b5cf6;
  --shadow:0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(10,60,50,.06);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg:#0b1210; --panel:#131d1a; --panel2:#18241f; --ink:#e8f0ed; --muted:#8fa29b; --line:#23312c; --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25); } }
:root[data-theme="dark"] { --bg:#0b1210; --panel:#131d1a; --panel2:#18241f; --ink:#e8f0ed; --muted:#8fa29b; --line:#23312c; --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25); }
* { box-sizing:border-box; }
body { margin:0; font:14.5px/1.45 Inter, -apple-system, system-ui, sans-serif; background:var(--bg); color:var(--ink); }
.shell { display:grid; grid-template-columns:232px 1fr; min-height:100vh; }
aside { background:linear-gradient(180deg,#0f3d39,#0b2a27); color:#dff3ea; padding:22px 14px; position:sticky; top:0; height:100vh; display:flex; flex-direction:column; gap:4px; }
.brand { display:flex; align-items:center; gap:10px; padding:0 8px 18px; }
.logo { width:40px; height:40px; border-radius:11px; background:linear-gradient(135deg,var(--brand2),var(--deep)); display:grid; place-items:center; position:relative; box-shadow:0 4px 14px rgba(46,196,132,.35); }
.brand b { font-size:18px; letter-spacing:-.3px; } .brand small { display:block; opacity:.65; font-style:italic; font-size:11.5px; }
aside button { all:unset; cursor:pointer; padding:10px 12px; border-radius:10px; display:flex; gap:10px; align-items:center; color:#b9d6cb; font-weight:500; }
aside button:hover { background:rgba(255,255,255,.06); color:#fff; }
aside button.on { background:rgba(46,196,132,.18); color:#fff; box-shadow:inset 3px 0 0 var(--brand2); }
aside .sp { flex:1; } aside .me { font-size:12px; opacity:.7; padding:8px 12px; }
main { padding:26px 32px 60px; width:100%; min-width:0; }
.top { display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:22px; flex-wrap:wrap; }
.top h1 { margin:0; font-size:26px; letter-spacing:-.6px; } .top p { margin:2px 0 0; color:var(--muted); }
.mp { display:flex; align-items:center; gap:6px; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:4px; box-shadow:var(--shadow); }
.mp button { border:0; background:none; color:var(--ink); width:32px; height:32px; border-radius:8px; cursor:pointer; font-size:18px; } .mp button:hover { background:var(--panel2); }
.mp b { min-width:140px; text-align:center; }
.grid { display:grid; gap:16px; } .g4 { grid-template-columns:repeat(4,1fr); } .g3 { grid-template-columns:repeat(3,1fr); } .g2 { grid-template-columns:3fr 2fr; } .g11 { grid-template-columns:1fr 1fr; }
.card { background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:18px; box-shadow:var(--shadow); min-width:0; }
.card h3 { margin:0 0 14px; font-size:14px; font-weight:600; display:flex; justify-content:space-between; align-items:center; gap:8px; }
.card h3 small { color:var(--muted); font-weight:500; }
.kpi { position:relative; overflow:hidden; }
.kpi .l { color:var(--muted); font-size:12.5px; font-weight:500; display:flex; align-items:center; gap:6px; }
.kpi .v { font-size:26px; font-weight:800; letter-spacing:-.8px; margin:6px 0 2px; font-variant-numeric:tabular-nums; }
.kpi .s { font-size:12.5px; color:var(--muted); }
.kpi .ic { position:absolute; right:14px; top:14px; width:34px; height:34px; border-radius:10px; display:grid; place-items:center; font-size:16px; }
.hero { background:linear-gradient(135deg,#17a37a,#0b5452); color:#fff; border:0; }
.hero .l, .hero .s { color:rgba(255,255,255,.8); }
.pos { color:var(--brand); } .neg { color:var(--red); } .hero .pos, .hero .neg { color:#fff; }
.pill { display:inline-flex; align-items:center; gap:4px; padding:2px 8px; border-radius:99px; font-size:11.5px; font-weight:600; }
.pill.ok { background:rgba(18,128,106,.12); color:var(--brand); } .pill.bad { background:rgba(217,72,63,.12); color:var(--red); } .pill.warn { background:rgba(232,160,22,.15); color:#b07400; } .pill.n { background:var(--panel2); color:var(--muted); }
.bud { display:grid; grid-template-columns:28px 1fr auto; gap:4px 10px; align-items:center; padding:10px 0; border-bottom:1px solid var(--line); }
.bud:last-child { border:0; } .bud .em { font-size:18px; grid-row:span 2; } .bud .nm { font-weight:600; } .bud .rm { text-align:right; font-weight:700; font-variant-numeric:tabular-nums; }
.bud .sub { color:var(--muted); font-size:12px; grid-column:2/4; display:flex; justify-content:space-between; }
.track { height:8px; background:var(--panel2); border-radius:99px; overflow:hidden; grid-column:2/4; position:relative; }
.track i { display:block; height:100%; border-radius:99px; background:linear-gradient(90deg,var(--brand2),var(--brand)); }
.track i.w { background:linear-gradient(90deg,#ffc94d,var(--amber)); } .track i.o { background:linear-gradient(90deg,#f07a6f,var(--red)); }
.track .pace { position:absolute; top:-2px; bottom:-2px; width:2px; background:var(--ink); opacity:.35; }
table { width:100%; border-collapse:collapse; } td, th { padding:10px 8px; border-bottom:1px solid var(--line); text-align:left; vertical-align:middle; }
th { color:var(--muted); font-weight:500; font-size:12px; text-transform:uppercase; letter-spacing:.4px; } tr:hover td { background:var(--panel2); }
.n { text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
input, select { font:inherit; padding:8px 10px; border:1px solid var(--line); border-radius:9px; background:var(--panel2); color:var(--ink); min-width:0; }
input:focus, select:focus { outline:2px solid var(--brand2); outline-offset:-1px; }
.btn { background:var(--brand); color:#fff; border:0; border-radius:9px; padding:9px 16px; font:600 14px Inter, sans-serif; cursor:pointer; white-space:nowrap; }
.btn:hover { filter:brightness(1.08); } .btn.ghost { background:var(--panel2); color:var(--ink); border:1px solid var(--line); }
.x { background:none; border:0; color:var(--muted); cursor:pointer; font-size:15px; border-radius:6px; padding:2px 6px; } .x:hover { color:var(--red); background:rgba(217,72,63,.1); }
.form { display:flex; gap:8px; flex-wrap:wrap; align-items:center; } .form > * { flex:1 1 120px; } .form .btn { flex:0 0 auto; }
.seg { display:inline-flex; background:var(--panel2); border:1px solid var(--line); border-radius:10px; padding:3px; }
.seg button { border:0; background:none; padding:6px 12px; border-radius:7px; cursor:pointer; color:var(--muted); font:600 13px Inter; } .seg button.on { background:var(--panel); color:var(--ink); box-shadow:var(--shadow); }
.tip { display:flex; gap:12px; padding:12px 14px; border-radius:12px; background:var(--panel2); margin-bottom:8px; border:1px solid var(--line); }
.tip .e { font-size:18px; } .tip.bad { border-left:4px solid var(--red); } .tip.good { border-left:4px solid var(--brand2); } .tip.warn { border-left:4px solid var(--amber); }
.goal { display:grid; grid-template-columns:96px 1fr; gap:16px; align-items:center; }
.ring { width:96px; height:96px; border-radius:50%; display:grid; place-items:center; }
.ring div { width:74px; height:74px; border-radius:50%; background:var(--panel); display:grid; place-items:center; font-weight:800; font-size:18px; }
.cal { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
.cal .h { font-size:11px; color:var(--muted); text-align:center; padding-bottom:4px; }
.cal .d { min-height:64px; border-radius:9px; background:var(--panel2); padding:5px 6px; font-size:11.5px; border:1px solid transparent; overflow:hidden; }
.cal .d.today { border-color:var(--brand2); } .cal .d.o { opacity:.35; }
.cal .d .b { display:block; margin-top:2px; padding:1px 5px; border-radius:5px; background:rgba(217,72,63,.12); color:var(--red); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.cal .d .b.tr { background:rgba(59,130,246,.13); color:var(--blue); }
.cal .d .b.in { background:rgba(18,128,106,.13); color:var(--brand); }
.chart { position:relative; height:260px; } .chart.sm { height:220px; }
.muted { color:var(--muted); } .empty { color:var(--muted); padding:20px; text-align:center; }
#ai { white-space:pre-wrap; line-height:1.6; }
.av { width:28px; height:28px; border-radius:50%; display:inline-grid; place-items:center; color:#fff; font-weight:700; font-size:12px; margin-right:8px; }
@media (max-width:1100px) { .g4 { grid-template-columns:repeat(2,1fr); } .g3, .g2, .g11 { grid-template-columns:1fr; } }
@media (max-width:760px) {
  .shell { grid-template-columns:1fr; } main { padding:16px; }
  aside { position:sticky; z-index:5; height:auto; flex-direction:row; overflow-x:auto; padding:8px; gap:2px; }
  .brand, aside .sp, aside .me { display:none; } aside button { padding:8px 10px; white-space:nowrap; }
  .g4 { grid-template-columns:1fr 1fr; } .kpi .v { font-size:21px; } .cal .d { min-height:46px; font-size:10px; } .cal .d .b { display:none; } .cal .d.has::after { content:"•"; color:var(--red); }
  .hide-m { display:none; }
}
@media (min-width:1700px) { main { padding:32px 48px 60px; } .g3 { grid-template-columns:repeat(3,1fr); } .chart { height:320px; } .chart.sm { height:260px; } }
</style>
</head>
<body>
<div class="shell">
  <aside id="nav"></aside>
  <main id="app"></main>
</div>
<script>
// ---------- data ----------
let D = {accounts:[],categories:[],entries:[],goals:[],contributions:[],people:[]};
let view = localStorage.getItem('view') || 'dash';
let month = new Date().toISOString().slice(0,7);
let F = {q:'', type:'', cat:'', acc:'', who:''};
let charts = [];
const $ = s => document.querySelector(s);
const cur = n => (n||0).toLocaleString(undefined,{style:'currency',currency:'USD'});
const cur0 = n => (n||0).toLocaleString(undefined,{style:'currency',currency:'USD',maximumFractionDigits:0});
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const byId = (t,id) => D[t].find(r=>r.id===id) || {};
const nm = (t,id) => byId(t,id).name || '—';
const icon = id => byId('categories',id).icon || '•';
const today = () => new Date().toISOString().slice(0,10);
const ym = (m,n) => { const x=new Date(m+'-01T12:00'); x.setMonth(x.getMonth()+n); return x.toISOString().slice(0,7); };
const mlabel = (m,o={month:'short'}) => new Date(m+'-01T12:00').toLocaleDateString(undefined,o);
const sum = (a,f=x=>+x.amount||0) => a.reduce((s,x)=>s+f(x),0);
const inM = (a,m) => a.filter(x=>x.date?.startsWith(m));
const exps = m => inM(D.entries,m).filter(e=>e.type==='expense');
const incs = m => inM(D.entries,m).filter(e=>e.type==='income');
let ME = {auth:false};
const me = () => ME.name || (()=>{try{return localStorage.getItem('me')||''}catch{return ''}})();
const people = () => [...new Set([...(D.people||[]).map(p=>p.name), ...(D.users||[]).map(u=>u.name), me()].filter(Boolean))].sort();
const personOpts = (sel,blank) => (blank!==undefined?`<option value="">${blank}</option>`:'')+people().map(p=>`<option ${p===sel?'selected':''}>${esc(p)}</option>`).join('');
const COLORS = ['#2ec484','#3b82f6','#e8a016','#8b5cf6','#ef6f6c','#14b8a6','#f472b6','#84cc16','#0ea5e9','#f97316','#64748b'];
const avColor = s => COLORS[[...String(s)].reduce((a,c)=>a+c.charCodeAt(0),0)%COLORS.length];

async function load(){
  const r = await fetch('/api/data'); if(r.status===401) return location.reload();
  D = await r.json(); render(); }
async function boot(){ try{ ME = await (await fetch('/api/me')).json(); }catch{} load(); }
async function post(t,row){ const r=await fetch('/api/'+t,{method:'POST',body:JSON.stringify(row)}); return r.json(); }
async function save(t,row){ await post(t,row); await load(); }
async function upd(t,id,field,val){ await save(t,{...byId(t,id),[field]:val}); }
async function del(t,id){ if(confirm('Delete this item?')){ await fetch(`/api/${t}/${id}`,{method:'DELETE'}); await load(); } }
const form = id => Object.fromEntries(new FormData(document.getElementById(id)));
const opts = (t,sel,blank,filter=()=>true) => (blank!==undefined?`<option value="">${blank}</option>`:'')+D[t].filter(filter).map(r=>`<option value="${r.id}" ${r.id===sel?'selected':''}>${esc((r.icon?r.icon+' ':'')+r.name)}</option>`).join('');
const expenseCats = () => D.categories.filter(c=>c.kind!=='income');

// ---------- derived ----------
function accountBalance(a){
  let b = +a.balance||0;
  D.entries.forEach(e=>{ if(e.date>today()) return;
    if(e.account_id===a.id) b += e.type==='income' ? +e.amount : -e.amount;      // transfers leave the "from" account…
    if(e.type==='transfer' && e.to_account_id===a.id) b += +e.amount; });         // …and arrive in the "to" account
  D.contributions.forEach(c=>{ if(c.from_account_id===a.id && !c.entry_id && !byId('goals',c.goal_id).account_id) b -= +c.amount; }); // moves made before goals had an account
  return b;
}
function goalInfo(g){
  const saved = sum(D.contributions.filter(c=>c.goal_id===g.id));
  const due = new Date(g.due+'T12:00'), now = new Date();
  const months = Math.max(1,(due.getFullYear()-now.getFullYear())*12 + due.getMonth()-now.getMonth());
  const start = D.contributions.filter(c=>c.goal_id===g.id).map(c=>c.date).sort()[0];
  const total = start ? Math.max(1,(due-new Date(start+'T12:00'))/864e5) : 0;
  const expected = start ? +g.target * Math.min(1,(now-new Date(start+'T12:00'))/864e5/total) : 0;
  return {saved, left:Math.max(0,g.target-saved), monthly:Math.max(0,g.target-saved)/months, months, pct:Math.min(100,saved/g.target*100||0), onTrack:saved>=expected*0.95};
}
function catStats(m){
  const es = exps(m), prev=[1,2,3].map(i=>exps(ym(m,-i)));
  return expenseCats().map(c=>{ const spent=sum(es.filter(e=>e.category_id===c.id));
    const avg=sum(prev.map(p=>({amount:sum(p.filter(e=>e.category_id===c.id))})))/3;
    return {...c, budget:+c.budget||0, spent, remaining:(+c.budget||0)-spent, avg}; });
}
function monthPace(m){ // fraction of the month gone
  const t=today().slice(0,7); if(m<t) return 1; if(m>t) return 0;
  const d=new Date(), dim=new Date(d.getFullYear(),d.getMonth()+1,0).getDate(); return d.getDate()/dim;
}
function recurring(){ // same category + similar amount in at least 3 of the last 4 months
  const months=[1,2,3,4].map(i=>ym(today().slice(0,7),-i)), groups={};
  D.entries.filter(e=>months.some(m=>e.date?.startsWith(m))).forEach(e=>{ const k=e.type+'|'+e.category_id+'|'+(e.note||'')+'|'+Math.round(e.amount/5); (groups[k]=groups[k]||[]).push(e); });
  return Object.values(groups).filter(g=>new Set(g.map(e=>e.date.slice(0,7))).size>=3)
    .map(g=>{ const e=g.sort((a,b)=>b.date.localeCompare(a.date))[0]; return {...e, day:+e.date.slice(8,10), avg:sum(g)/g.length}; });
}
function upcoming(days=45){
  const t=today(), end=new Date(Date.now()+days*864e5).toISOString().slice(0,10), list=[];
  D.entries.filter(e=>e.date>t && e.date<=end).forEach(e=>list.push({...e,src:'scheduled'}));
  recurring().forEach(r=>{ for(let i=0;i<2;i++){ const m=ym(t.slice(0,7),i), d=`${m}-${String(Math.min(r.day,28)).padStart(2,'0')}`;
    if(d>t && d<=end && !D.entries.some(e=>e.date.startsWith(m)&&e.category_id===r.category_id&&e.type===r.type&&Math.abs(e.amount-r.amount)<5)) list.push({...r,date:d,amount:r.avg,src:'predicted'}); }});
  return list.sort((a,b)=>a.date.localeCompare(b.date));
}

// ---------- shell ----------
const VIEWS = {dash:['📊','Dashboard'], tx:['🧾','Transactions'], import:['📥','Import statement'], budgets:['🎯','Budgets'], goals:['🏁','Goals'], bills:['📅','Bills'], accounts:['🏦','Accounts'], insights:['✨','Insights'], settings:['⚙️','Settings']};
function go(v){ view=v; try{localStorage.setItem('view',v)}catch{} render(); window.scrollTo(0,0); }
function shift(n){ month=ym(month,n); render(); }
const monthPicker = () => `<div class="mp"><button onclick="shift(-1)" aria-label="Previous month">‹</button><b>${mlabel(month,{month:'long',year:'numeric'})}</b><button onclick="shift(1)" aria-label="Next month">›</button></div>`;
const pageTop = (title,sub,right='') => `<div class="top"><div><h1>${title}</h1><p>${sub}</p></div><div class="form" style="flex:0 1 auto">${right}</div></div>`;
function render(){
  charts.forEach(c=>c.destroy()); charts=[];
  $('#nav').innerHTML = `<div class="brand"><img class="logo" src="/icon.png" alt=""><div><b>MyBudget</b><small>You've got to have a plan...</small></div></div>`+
    Object.entries(VIEWS).map(([k,[i,l]])=>`<button class="${k===view?'on':''}" onclick="go('${k}')"><span>${i}</span>${l}</button>`).join('')+
    `<div class="sp"></div><div class="me">${ME.auth?`${ME.picture?`<img src="${esc(ME.picture)}" referrerpolicy="no-referrer" style="width:22px;height:22px;border-radius:50%;vertical-align:middle;margin-right:6px">`:''}${esc(me())} · <a href="/auth/logout" style="color:#9fe3c4">Sign out</a>`:(me()?'Entering as '+esc(me()):'Set your name in Settings')}</div>`;
  $('#app').innerHTML = ({dash:dashView, tx:txView, import:importView, budgets:budgetsView, goals:goalsView, bills:billsView, accounts:accountsView, insights:insightsView, settings:settingsView}[view]||dashView)();
  (afterRender[view]||(()=>{}))();
}
const afterRender = {};
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
function chart(id,cfg){ if(!window.Chart||!document.getElementById(id)) return;
  Chart.defaults.font.family='Inter, system-ui'; Chart.defaults.color=css('--muted'); Chart.defaults.borderColor=css('--line');
  charts.push(new Chart(document.getElementById(id),cfg)); }

// ---------- dashboard ----------
function dashView(){
  const inc=sum(incs(month)), exp=sum(exps(month)), saved=sum(inM(D.contributions,month)), left=inc-exp-saved;
  const cs=catStats(month), budget=sum(cs,c=>c.budget), pace=monthPace(month);
  const flex=cs.filter(c=>c.kind!=='fixed'), flexLeft=Math.max(0,sum(flex,c=>Math.max(0,c.remaining)));
  const d=new Date(), dim=new Date(d.getFullYear(),d.getMonth()+1,0).getDate(), daysLeft=month===today().slice(0,7)?dim-d.getDate()+1:0;
  const rate=inc?Math.round((inc-exp)/inc*100):0, prevExp=sum(exps(ym(month,-1)));
  const chg=prevExp?Math.round((exp/prevExp-1)*100):null;
  const nw=sum(D.accounts,a=>accountBalance(a)), up=upcoming(30).filter(u=>u.type==='expense').slice(0,6);
  const tips=buildTips(analyze()).slice(0,3);
  const bars=cs.filter(c=>c.budget||c.spent).sort((a,b)=>(b.spent/(b.budget||1))-(a.spent/(a.budget||1))).slice(0,7);
  return pageTop(`Hi${me()?', '+esc(me()):''} 👋`,'Here is how your household is doing this month.',monthPicker())+
  `<div class="grid g4">
    <div class="card kpi hero"><div class="l">Left to spend</div><div class="v">${cur0(budget-exp)}</div>
      <div class="s">of ${cur0(budget)} budget${daysLeft?` · <b>${cur0(flexLeft/daysLeft)}/day</b> safe for ${daysLeft} days`:''}</div></div>
    <div class="card kpi"><div class="ic" style="background:rgba(18,128,106,.12)">💰</div><div class="l">Income</div><div class="v pos">${cur0(inc)}</div><div class="s">Savings rate <b class="${rate>=20?'pos':rate<0?'neg':''}">${rate}%</b></div></div>
    <div class="card kpi"><div class="ic" style="background:rgba(217,72,63,.1)">💳</div><div class="l">Spent</div><div class="v">${cur0(exp)}</div>
      <div class="s">${chg===null?'—':`<span class="pill ${chg>0?'bad':'ok'}">${chg>0?'▲':'▼'} ${Math.abs(chg)}%</span> vs last month`}</div></div>
    <div class="card kpi"><div class="ic" style="background:rgba(232,160,22,.15)">🏁</div><div class="l">Moved to goals</div><div class="v">${cur0(saved)}</div><div class="s">Unassigned <b class="${left<0?'neg':'pos'}">${cur0(left)}</b></div></div>
  </div>
  <div class="grid g2" style="margin-top:16px">
    <div class="card"><h3>Cash flow <small>last 6 months</small></h3><div class="chart"><canvas id="cf"></canvas></div></div>
    <div class="card"><h3>Where the money went <small>${mlabel(month,{month:'long'})}</small></h3><div class="chart"><canvas id="donut"></canvas></div></div>
  </div>
  <div class="grid g3" style="margin-top:16px">

function txType(t){ const tr=t==='transfer', c=$('#ef-cat');

async function addEntry(ev){
  ev.preventDefault(); const f=form('ef'), n=+f.repeat||1; delete f.repeat;
  if(f.type==='transfer'){ if(f.account_id===f.to_account_id) return alert('Choose two different accounts.'); f.category_id=''; } else f.to_account_id='';
  for(let i=0;i<n;i++){ const d=new Date(f.date+'T12:00'); d.setMonth(d.getMonth()+i); await post('entries',{...f,amount:+f.amount,date:d.toISOString().slice(0,10)}); }

function exportCSV(){
  const rows=[['date','type','amount','category','account','note','entered_by'],...D.entries.sort((a,b)=>a.date.localeCompare(b.date)).map(e=>[e.date,e.type,e.amount,nm('categories',e.category_id),nm('accounts',e.account_id),e.note||'',e.entered_by||''])];
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n')],{type:'text/csv'})); a.download=`mybudget-${today()}.csv`; a.click();
}
async function importCSV(file){
  if(!file) return; const lines=(await file.text()).trim().split(/\r?\n/); const head=lines.shift().toLowerCase().split(',').map(s=>s.replace(/"/g,'').trim());
  const find=(t,name)=>D[t].find(r=>r.name.toLowerCase()===String(name).toLowerCase())?.id||'';
  let n=0; for(const l of lines){ const v=(l.match(/("([^"]|"")*"|[^,]*)(,|$)/g)||[]).map(s=>s.replace(/,$/,'').replace(/^"|"$/g,'').replace(/""/g,'"')); const r=Object.fromEntries(head.map((h,i)=>[h,v[i]]));
    if(!r.date||!r.amount) continue; const amt=parseFloat(String(r.amount).replace(/[^0-9.\-]/g,''));
    await post('entries',{date:r.date.slice(0,10),type:r.type||(amt<0?'expense':'expense'),amount:Math.abs(amt),category_id:find('categories',r.category),account_id:find('accounts',r.account),note:r.note||r.description||'',entered_by:r.entered_by||me()}); n++; }
  alert(`Imported ${n} transactions.`); load();
}

function buildTips(a){

    if(c.budget&&now>c.budget) t.push(['bad','🚨',`<b>${esc(c.name)}</b> is over budget by ${cur(now-c.budget)}.`,3]);
    else if(c.budget&&pace<1&&now>c.budget*pace*1.2&&now>c.budget*.5) t.push(['warn','⏱️',`<b>${esc(c.name)}</b> is ahead of pace: ${Math.round(now/c.budget*100)}% used with ${Math.round(pace*100)}% of the month gone.`,2]);
    if(overN>=2) t.push(['bad','🔁',`<b>${esc(c.name)}</b> went over budget in ${overN} of the last 3 months (avg ${cur0(avg)} vs ${cur0(c.budget)}). Cut back or set a realistic budget.`,2]);
    if(avg>50&&now>avg*1.25&&pace===1) t.push(['warn','📈',`<b>${esc(c.name)}</b> is ${Math.round((now/avg-1)*100)}% above its 3-month average.`,1]);
    if(c.budget&&avg>0&&avg<c.budget*.6&&a.prev3.every(x=>c.months[x]>0)) t.push(['good','💡',`<b>${esc(c.name)}</b> usually costs ${cur0(avg)}, under its ${cur0(c.budget)} budget. Move ~${cur0(c.budget-avg)}/month to a goal.`,1]); });
  const top=o=>Object.entries(o).sort((x,y)=>y[1]-x[1]), tot=Object.values(a.byWeekday).reduce((s,v)=>s+v,0);
  const wd=top(a.byWeekday)[0]; if(wd&&tot&&wd[1]/tot>.22) t.push(['warn','📅',`<b>${wd[0]}</b> is your most expensive day (${Math.round(wd[1]/tot*100)}% of spending). Plan those days ahead.`,1]);
  const pm=top(a.byPartOfMonth)[0]; if(pm&&tot&&pm[1]/tot>.45) t.push(['warn','🗓️',`Most spending happens in <b>${pm[0]}</b> of the month (${Math.round(pm[1]/tot*100)}%). Move savings right after payday.`,1]);
  const rs=a.recurring.reduce((s,r)=>s+r.monthly,0); if(rs) t.push(['','🔄',`You have ${a.recurring.length} recurring charges totaling <b>${cur0(rs)}/month</b> (${cur0(rs*12)}/yr). Review subscriptions you no longer use.`,1]);
  a.goals.forEach(g=>{ if(g.saved>=g.target) t.push(['good','🎉',`Goal <b>${esc(g.name)}</b> is fully funded!`,1]); else if(!g.onTrack) t.push(['warn','🏁',`Goal <b>${esc(g.name)}</b> is behind. Save ${cur0(g.neededPerMonth)}/month to catch up.`,2]); });
  const left=a.income[m]-a.categories.reduce((s,c)=>s+c.months[m],0)-sum(inM(D.contributions,m));
  if(a.income[m]&&left>0) t.push(['good','💰',`${cur0(left)} is not assigned this month. Move it to a goal.`,2]);
  if(a.income[m]&&left<0) t.push(['bad','⚠️',`You're spending ${cur0(-left)} more than you earn this month.`,3]);
  return t.sort((x,y)=>y[3]-x[3]);
}

let IMP = {file:'', raw:[], head:[], map:{}, rows:[], account:'', person:'', sign:'auto', datefmt:'auto', kind:''};
const RULES = [
  [/payroll|salary|direct dep|salario|salário|paycheck|folha/i,'salary'],
  [/costco|walmart|kroger|safeway|whole foods|trader joe|aldi|publix|h-e-b|heb |wegmans|grocery|supermarket|supermerc|mercado|carrefour|pão de açúcar/i,'grocer'],
  [/restaurant|cafe|coffee|starbucks|mcdonald|uber ?eats|doordash|grubhub|pizza|burger|chipotle|ifood|padaria|bar /i,'dining'],
  [/electric|energy|water|comcast|xfinity|verizon|at&t|t-mobile|internet|spectrum|pg&e|duke energy|enel|sabesp|vivo|claro/i,'utilit'],
  [/rent|mortgage|aluguel|hoa /i,'rent'],
  [/geico|progressive|state farm|allstate|car insur/i,'car ins'],
  [/home insur|homeowners|lemonade/i,'house ins'],
  [/auto loan|toyota fin|honda fin|ford credit|car payment|financiamento/i,'car loan'],
  [/school|tuition|escola|daycare|kindercare/i,'school'],
];
const TRANSFER = /payment thank you|autopay|online payment|credit card payment|transfer (to|from)|pagamento fatura|transferência/i;
const normDesc = s => String(s||'').toLowerCase().replace(/[0-9#*]+/g,' ').replace(/[^a-z&à-ú ]/g,' ').split(/\s+/).filter(Boolean).slice(0,3).join(' ');
function guessCategory(desc,type){
  const n=normDesc(desc);
  const past=D.entries.filter(e=>e.note&&normDesc(e.note)===n&&e.category_id).sort((a,b)=>b.date.localeCompare(a.date))[0];
  if(past) return past.category_id;
  for(const [re,key] of RULES) if(re.test(desc)){ const c=D.categories.find(c=>c.name.toLowerCase().includes(key)); if(c) return c.id; }
  if(type==='income') return (D.categories.find(c=>c.kind==='income'&&/other/i.test(c.name))||D.categories.find(c=>c.kind==='income')||{}).id||'';
  return '';
}
function parseCSV(text){
  const first=text.split(/\r?\n/)[0], delim=[',',';','\t'].sort((a,b)=>first.split(b).length-first.split(a).length)[0];
  const rows=[]; let row=[], f='', q=false;
  for(let i=0;i<text.length;i++){ const ch=text[i];
    if(q){ if(ch==='"'){ if(text[i+1]==='"'){f+='"';i++;} else q=false; } else f+=ch; }
    else if(ch==='"') q=true; else if(ch===delim){ row.push(f); f=''; }
    else if(ch==='\n'||ch==='\r'){ if(ch==='\r'&&text[i+1]==='\n') i++; row.push(f); if(row.some(v=>v.trim())) rows.push(row); row=[]; f=''; }
    else f+=ch; }
  row.push(f); if(row.some(v=>v.trim())) rows.push(row);
  // skip bank preamble lines: header is the first row that mentions a date column
  const hi=Math.max(0,rows.findIndex(r=>r.some(c=>/date|data/i.test(c))));
  return {head:rows[hi].map(h=>h.trim()), raw:rows.slice(hi+1)};
}
function parseOFX(text){
  const tag=(b,t)=>(b.match(new RegExp('<'+t+'>([^<\\r\\n]*)','i'))||[])[1]?.trim()||'';
  const raw=[...text.matchAll(/<STMTTRN>([\s\S]*?)(<\/STMTTRN>|(?=<STMTTRN>)|<\/BANKTRANLIST>)/gi)].map(m=>{ const d=tag(m[1],'DTPOSTED');
    return [`${d.slice(0,4)}-${d.slice(4,6)}-${d.slice(6,8)}`, tag(m[1],'NAME')+(tag(m[1],'MEMO')&&tag(m[1],'MEMO')!==tag(m[1],'NAME')?' '+tag(m[1],'MEMO'):''), tag(m[1],'TRNAMT')]; });
  return {head:['Date','Description','Amount'], raw};
}
function parseAmount(v){
  let s=String(v||'').trim(); if(!s) return NaN; const neg=/^\(.*\)$/.test(s)||/^-|-$|\bDR\b|D$/i.test(s);
  s=s.replace(/[^0-9.,]/g,''); const lc=s.lastIndexOf(','), ld=s.lastIndexOf('.');
  if(lc>ld && s.length-lc<=3) s=s.replace(/\./g,'').replace(',','.'); else s=s.replace(/,/g,'');
  const n=parseFloat(s); return neg?-n:n;
}
function parseDate(v,fmt){
  const s=String(v||'').trim(); let m;
  if(m=s.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/)) return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  if(m=s.match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{2,4})/)){ const y=m[3].length===2?'20'+m[3]:m[3];
    let dmy = fmt==='dmy' || (fmt==='auto' && (+m[1]>12 || IMP.dmyGuess)); const [d,mo]=dmy?[m[1],m[2]]:[m[2],m[1]];
    return `${y}-${mo.padStart(2,'0')}-${d.padStart(2,'0')}`; }
  const d=new Date(s); return isNaN(d)?'':d.toISOString().slice(0,10);
}
function guessMap(head){
  const f=(...res)=>{ for(const re of res){ const i=head.findIndex(h=>re.test(h)); if(i>=0) return i; } return -1; };
  return {date:f(/posting date|transaction date|^date$/i,/date|data/i), desc:f(/desc/i,/payee|merchant|name/i,/memo|hist|estabelec|lançamento|lancamento/i,/details/i),
    amount:f(/^amount$|amount|valor|value|total/i), debit:f(/debit|withdraw|saída|saida|débito/i), credit:f(/credit|deposit|entrada|crédito/i), type:f(/^type$|tipo|transaction type/i)};
}
async function pickStatement(file){
  if(!file) return; const text=await file.text(); const ofx=/<OFX>|OFXHEADER/i.test(text);
  const {head,raw}=ofx?parseOFX(text):parseCSV(text);
  const acc=IMP.account||D.accounts.find(a=>a.kind==='card'&&file.name.toLowerCase().includes(a.name.toLowerCase()))?.id||'';
  IMP={...IMP,file:file.name,head,raw,map:guessMap(head),kind:ofx?'OFX':'CSV',account:acc};
  if(!IMP.person) IMP.person=byId('accounts',acc).owner||me();
  IMP.dmyGuess = raw.some(r=>{const m=String(r[IMP.map.date]||'').match(/^(\d{1,2})[-/.]/); return m&&+m[1]>12;});
  buildRows(); render();
}
function buildRows(){
  const M=IMP.map, acc=byId('accounts',IMP.account), card = IMP.sign==='card' || (IMP.sign==='auto' && acc.kind==='card' && M.amount>=0 && IMP.raw.filter(r=>parseAmount(r[M.amount])>0).length > IMP.raw.filter(r=>parseAmount(r[M.amount])<0).length);
  IMP.rows = IMP.raw.map((r,i)=>{
    let amt = M.amount>=0 && r[M.amount]?.trim() ? parseAmount(r[M.amount]) : (parseAmount(r[M.credit])||0) - (parseAmount(r[M.debit])||0);
    if(M.type>=0 && /debit|d$|saída/i.test(r[M.type]||'') && amt>0) amt=-amt;
    if(card) amt=-amt;  // credit-card exports list purchases as positive numbers
    const desc=(r[M.desc]||'').trim(), date=parseDate(r[M.date],IMP.datefmt), type=amt>=0?'income':'expense', amount=Math.abs(amt);
    const dup=D.entries.some(e=>e.date===date&&Math.abs(e.amount-amount)<.005&&e.type===type&&(!IMP.account||e.account_id===IMP.account));
    const transfer=TRANSFER.test(desc);
    return {i,date,desc,type,amount,sign:amt>=0?1:-1,category_id:guessCategory(desc,type),include:!!date&&amount>0&&!dup&&!transfer,dup,transfer};
  }).filter(r=>r.date||r.amount);
}
const impSet = (k,v) => { IMP[k]=v; if(['account','sign','datefmt'].includes(k)||k.startsWith('map.')) buildRows(); if(k==='account'&&byId('accounts',v).owner) IMP.person=byId('accounts',v).owner; render(); };
const rowSet = (i,k,v) => { const r=IMP.rows.find(r=>r.i===i); r[k]=v; if(k==='type'){ r.category_id=v==='transfer'?'':guessCategory(r.desc,v); if(v==='transfer') r.include=true; } render(); };
function importView(){
  const R=IMP.rows, inc=R.filter(r=>r.include&&r.type==='income'), exp=R.filter(r=>r.include&&r.type==='expense'), unc=R.filter(r=>r.include&&!r.category_id).length;
  const col=(k,label)=>`<label class="muted" style="font-size:12px">${label}<br><select onchange="IMP.map.${k}=+this.value;buildRows();render()"><option value="-1">—</option>${IMP.head.map((h,i)=>`<option value="${i}" ${IMP.map[k]===i?'selected':''}>${esc(h)}</option>`).join('')}</select></label>`;
  return pageTop('Import statement','Upload a bank or card statement. MyBudget finds income and expenses and tags them to a person.','')+
  `<div class="card"><h3>1 · Statement</h3><div class="form">
    <label class="btn ghost" style="flex:0 0 auto">📄 ${IMP.file?esc(IMP.file):'Choose CSV / OFX / QFX file'}<input type="file" accept=".csv,.ofx,.qfx,.txt" hidden onchange="pickStatement(this.files[0])"></label>
    <label class="muted" style="font-size:12px">Account / card<br><select onchange="impSet('account',this.value)">${opts('accounts',IMP.account,'Choose…')}</select></label>
    <label class="muted" style="font-size:12px">Whose statement?<br><select onchange="if(this.value==='__new'){const n=prompt('Name of the person');impSet('person',n||'')}else impSet('person',this.value)">${personOpts(IMP.person,'Shared / household')}<option value="__new">+ Someone else…</option></select></label>
    <label class="muted" style="font-size:12px">Amounts<br><select onchange="impSet('sign',this.value)"><option value="auto">Detect</option><option value="bank" ${IMP.sign==='bank'?'selected':''}>Negative = expense (bank)</option><option value="card" ${IMP.sign==='card'?'selected':''}>Positive = expense (credit card)</option></select></label>
    <label class="muted" style="font-size:12px">Dates<br><select onchange="impSet('datefmt',this.value)"><option value="auto">Detect</option><option value="mdy" ${IMP.datefmt==='mdy'?'selected':''}>MM/DD/YYYY</option><option value="dmy" ${IMP.datefmt==='dmy'?'selected':''}>DD/MM/YYYY</option></select></label></div>
    <p class="muted" style="margin-bottom:0">Most banks offer “Download transactions” as CSV or OFX/QFX (Quicken). PDF statements aren't supported — download the CSV version instead.</p></div>
  ${IMP.kind==='CSV'?`<div class="card" style="margin-top:16px"><h3>2 · Columns <small>detected automatically — fix if needed</small></h3><div class="form">${col('date','Date')}${col('desc','Description')}${col('amount','Amount')}${col('debit','Debit / out')}${col('credit','Credit / in')}${col('type','Type (optional)')}</div></div>`:''}
  ${R.length?`<div class="grid g4" style="margin-top:16px">
    <div class="card kpi"><div class="l">Transactions found</div><div class="v">${R.length}</div><div class="s">${R.filter(r=>r.include).length} selected</div></div>
    <div class="card kpi"><div class="l">Income</div><div class="v pos">${cur0(sum(inc))}</div><div class="s">${inc.length} items → ${esc(IMP.person||'household')}</div></div>
    <div class="card kpi"><div class="l">Expenses</div><div class="v neg">${cur0(sum(exp))}</div><div class="s">${exp.length} items → ${esc(IMP.person||'household')}</div></div>
    <div class="card kpi"><div class="l">Skipped</div><div class="v">${R.filter(r=>r.dup).length+R.filter(r=>r.transfer).length}</div><div class="s">${R.filter(r=>r.dup).length} duplicates · ${R.filter(r=>r.transfer).length} transfers</div></div></div>
  <div class="card" style="margin-top:16px"><h3>3 · Review <small>${unc?`<span class="pill warn">${unc} need a category</span>`:'<span class="pill ok">All categorized</span>'}</small></h3>
    <table><tr><th><input type="checkbox" ${R.every(r=>r.include)?'checked':''} onchange="IMP.rows.forEach(r=>r.include=this.checked);render()"></th><th>Date</th><th>Description</th><th>Type</th><th>Category</th><th class="n">Amount</th><th></th></tr>
    ${R.map(r=>`<tr style="${r.include?'':'opacity:.5'}"><td><input type="checkbox" ${r.include?'checked':''} onchange="rowSet(${r.i},'include',this.checked)"></td><td>${r.date||'<span class="neg">?</span>'}</td><td>${esc(r.desc)}</td>
      <td><select onchange="rowSet(${r.i},'type',this.value)"><option value="expense">Expense</option><option value="income" ${r.type==='income'?'selected':''}>Income</option><option value="transfer" ${r.type==='transfer'?'selected':''}>Transfer</option></select></td>
      <td>${r.type==='transfer'?`<select onchange="rowSet(${r.i},'other',this.value)" style="${r.other?'':'border-color:var(--amber)'}">${opts('accounts',r.other,r.sign>0?'From account…':'To account…',a=>a.id!==IMP.account)}</select>`:`<select onchange="rowSet(${r.i},'category_id',this.value)" style="${r.category_id?'':'border-color:var(--amber)'}">${opts('categories',r.category_id,'Choose…',c=>r.type==='income'?c.kind==='income':c.kind!=='income')}</select>`}</td>
      <td class="n ${r.type==='income'?'pos':''}"><b>${r.type==='income'?'+':'−'}${cur(r.amount)}</b></td><td>${r.dup?'<span class="pill n">duplicate</span>':r.transfer?'<span class="pill n">transfer</span>':''}</td></tr>`).join('')}</table>
    <div class="form" style="margin-top:14px;justify-content:flex-end"><span class="muted" style="flex:1">Imported as ${esc(IMP.person||'household')} on ${esc(nm('accounts',IMP.account))}. Next time, similar descriptions get the same category.</span>
      <button class="btn" onclick="doImport()" ${IMP.account&&R.some(r=>r.include)?'':'disabled'}>Import ${R.filter(r=>r.include).length} transactions</button></div></div>`
  : IMP.file?'<div class="card empty" style="margin-top:16px">No transactions found in this file. Check the columns above.</div>':''}`;
}
async function doImport(){
  if(IMP.person==='__new'){ const n=prompt('Name of the person'); if(!n) return; IMP.person=n; }
  const bad=IMP.rows.filter(r=>r.include&&r.type==='transfer'&&!r.other).length; if(bad) return alert(`Choose the other account for ${bad} transfer(s).`);
  const rows=IMP.rows.filter(r=>r.include&&r.date).map(r=>{ const tr=r.type==='transfer', [from,to]=r.sign>0?[r.other,IMP.account]:[IMP.account,r.other];
    return {date:r.date,type:r.type,amount:+r.amount.toFixed(2),category_id:tr?'':r.category_id,account_id:tr?from:IMP.account,to_account_id:tr?to:'',note:r.desc,entered_by:IMP.person||''}; });
  const res=await (await fetch('/api/bulk/entries',{method:'POST',body:JSON.stringify({rows})})).json();
  IMP={file:'',raw:[],head:[],map:{},rows:[],account:'',person:'',sign:'auto',datefmt:'auto',kind:''};
  await load(); alert(`Imported ${res.imported} transactions.`); go('tx');
}
boot();
</script>
</body>
